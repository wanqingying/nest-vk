# version: "3.8"

services:
  # ...existing services...

  dev:
    image: node:20.14.0
    container_name: dev
    volumes:
      - .:/app
    working_dir: /app
    # ports:
      # - '8500:8500'
    command:
      ['./node_modules/.bin/ts-node', 'scripts/kafka/dev.ts']
    networks:
      - app-network

  start:
    image: node:22.17.1-slim
    container_name: start
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - '3015:3000'
    command:
      ['npm','run', 'start:dev','nest-bull-ui']
    networks:
      - app-network

  t-server:
    image: node:20.14.0
    hostname: t-server
    volumes:
      - .:/app
    working_dir: /app
    command:
       ['node', 'dist/apps/nest-test-app/main.js']
    networks:
      - app-network
    deploy:
      replicas: 1

  rpc-s-dns:
    image: node:20.14.0
    hostname: rpc-s-dns
    volumes:
      - .:/app
    working_dir: /app
    command:
       ['node', 'dist/apps/nest-rpc-dns-server/main.js']
    networks:
      - app-network
    deploy:
      replicas: 2

  rpc-c-consul:
    image: node:20.14.0
    hostname: rpc-c-consul
    volumes:
      - .:/app
    working_dir: /app
    command:
       ['node', 'dist/apps/nest-rpc-client/main.js']
    networks:
      - app-network
    deploy:
      replicas: 1

  e2e:
    image: node:20.14.0
    container_name: e2e
    volumes:
      - .:/app
    working_dir: /app
    # ports:
      # - '3007:3007'
    command:
      ['npm', 'run', 'test:e2e']
    networks:
      - app-network

  consul:
    image: consul:1.15.4
    hostname: consul
    ports:
      - '8500:8500'
      - '8600:8600/udp'
    command:
      ['agent', '-server', '-bootstrap-expect=1', '-ui', '-client=0.0.0.0']
    networks:
      - app-network

  rsc:
    image: node:20.14.0
    container_name: run-script
    volumes:
      - .:/app
    working_dir: /app
    command: ['node', 'scripts/redis/node-redis.js']
    networks:
      - app-network

  mongo:
    image: mongo:6
    container_name: mongo2
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass
    volumes:
      - ./volumes/data/mongo-rep:/data/mongo/db
      - ./volumes/config/mongo-rep:/etc/mongo
      - ./volumes/config/mongo-rep/mongo-keyfile:/etc/mongo-keyfile
      - ./volumes/config/mongo-rep/init.js:/docker-entrypoint-initdb.d/init.js
    command:
      [
        'mongod',
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--keyFile',
        '/etc/mongo-keyfile',
      ]
    networks:
      - app-network

  mongo-init:
    image: mongo:6
    container_name: mongo-init
    depends_on:
      - mongo
    networks:
      - app-network
    command: >
      bash -c "
      sleep 5 &&
      mongosh --host mongo2 --username user --password pass --authenticationDatabase admin --eval '
        rs.initiate({
          _id: \"rs0\",
          members: [
            { _id: 0, host: \"mongo2:27017\" }
          ]
        });
      '
      "

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: user
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_URL: mongodb://user:pass@mongo2:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo-init
    networks:
      - app-network

  mysql:
    image: mysql:8.4.5
    container_name: mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - ./volumes/data/mysql:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

