# version: "3.8"

services:
  # ...existing services...

  consul:
    image: consul:1.15.4
    container_name: consul
    ports:
      - '8500:8500'
      - '8600:8600/udp'
    command:
      ['agent', '-server', '-bootstrap-expect=1', '-ui', '-client=0.0.0.0']
    networks:
      - app-network


networks:
  app-network:
    driver: bridge
