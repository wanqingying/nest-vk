version: '3.8'

services:
  mysql:
    image: mysql:8.4.5
    container_name: mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: dev-password
      MYSQL_DATABASE: dev_db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  mysql_data:
