  localstack:
    image: localstack/localstack:2.3.2
    hostname: localstack-p-viewer
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/var/lib/localstack/data
      - OPEN_SEARCH_CLIENT_MANAGED_CLUSTER_REGION=us-west-2
      - DEFAULT_REGION=us-west-2
      - S3_BUCKET=local-image-processor-bucket,non-default-image-processor-bucket
    networks:
      - app-network

  localstack-setup:
    image: localstack/localstack:2.3.2
    env_file: ./env.example
    depends_on:
      - localstack
    restart: "no"
    entrypoint: sh -c /configure-localstack.sh
    volumes:
      - './tools/configure-localstack.sh:/configure-localstack.sh'
    networks:
      - app-network

  redis:
    image: redis:6.2
    container_name: flip-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G

  redis-1:
    container_name: redis-cluster
    hostname: redis-cluster
    image: redis:latest
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6378:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-2:
    image: redis:latest
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6390:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-3:
    image: redis:latest
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6391:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-cluster-init:
    image: redis:latest
    command: >
      bash -c "
        sleep 15 &&
        echo yes | redis-cli --cluster create redis-1:6379 redis-2:6379 redis-3:6379 --cluster-replicas 0
      "
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    networks:
      - app-network

  broker:
    image: rabbitmq:3.9-management-alpine
    container_name: flip-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_ERLANG_COOKIE=SWQOKODSQALRPCLNMEQG
      - RABBITMQ_DEFAULT_USER=rabbitmq
      - RABBITMQ_DEFAULT_PASS=bJfjG49cm0oS1aZKuK3z
      - RABBITMQ_DEFAULT_VHOST=/
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G



networks:
  app-network:
    name: app-network
    driver: bridge
