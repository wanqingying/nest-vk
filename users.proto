  }

  oneof _lastSmartFullViewedDebatesPosts {
    LastSmartFullViewedDebatesPostsWrapper lastSmartFullViewedDebatesPosts = 18;
  }


  oneof _lastCommentedDebatesPosts {
    LastCommentedDebatesPostsWrapper lastCommentedDebatesPosts = 19;
  }

  oneof _lastSavedDebatesPosts {
    LastSavedDebatesPostsWrapper lastSavedDebatesPosts = 20;
  }

  oneof _lastVotedUpDebatesPosts {
    LastVotedUpDebatesPostsWrapper lastVotedUpDebatesPosts = 21;
  }

  oneof _lastVotedDownDebatesPosts {
    LastVotedDownDebatesPostsWrapper lastVotedDownDebatesPosts = 22;
  }

  oneof _lastSharedDebatesPosts {
    LastSharedDebatesPostsWrapper lastSharedDebatesPosts = 23;
  }
  
  oneof _lastOpenedCommentsDebatesPosts {
    LastOpenedCommentsDebatesPostsWrapper lastOpenedCommentsDebatesPosts = 24;
