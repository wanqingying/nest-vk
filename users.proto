message LastOpenedCommentsDebatesPostsWrapper {
  repeated UserMetricPostValueObject values = 1;
}

message LastViewedRootDebatesPostsWrapper {
  repeated UserMetricPostValueObject values = 1;
}

message LastOpenedCommentsPostsWrapper {
  repeated UserMetricPostValueObject values = 1;
}

message UserMetrics {
  string userId = 1;
  
  oneof _lastAddedToCartProductItems {
    LastAddedToCartProductItemsWrapper lastAddedToCartProductItems = 2;
  }

  oneof _lastProductPageViewedProductItems {
    LastProductPageViewedProductItemsWrapper lastProductPageViewedProductItems = 3;
  }

  oneof _lastDesiredProductItems {
    LastDesiredProductItemsWrapper lastDesiredProductItems = 4;
  }

  oneof _lastOrderedProductItems {
    LastOrderedProductItemsWrapper lastOrderedProductItems = 5;
  }

  oneof _lastFullViewedPosts {
    LastFullViewedPostsWrapper lastFullViewedPosts = 6;
  }

  oneof _lastCommentedPosts {
    LastCommentedPostsWrapper lastCommentedPosts = 7;
  }

  oneof _lastSmartFullViewedPosts {
    LastSmartFullViewedPostsWrapper lastSmartFullViewedPosts = 8;
  }

  oneof _lastBelow2sViewedPosts {
    LastBelow2sViewedPostsWrapper lastBelow2sViewedPosts = 9;
  }

  oneof _lastAddedToCartFromPosts {
    LastAddedToCartFromPostsWrapper lastAddedToCartFromPosts = 10;
  }

  oneof _lastVotedUpPosts {
    LastVotedUpPostsWrapper lastVotedUpPosts = 11;
  }

  oneof _lastSharedPosts {
    LastSharedPostsWrapper lastSharedPosts = 12;
